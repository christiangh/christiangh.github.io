pre-commit:
  piped: true
  jobs:
    - name: prettier
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{js,mjs,ts,astro}'
      run: pnpm eslint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-push:
  jobs:
    - name: astro-check
      run: pnpm check
